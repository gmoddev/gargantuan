  scheduled-allocation-pass:
    if: github.event_name == 'workflow_dispatch' && inputs.schedule_followup_only && inputs.solver_qualification_only
    name: Separate qualified-profile allocation accounting / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            suffix: ''
          - os: windows-2025-vs2026
            suffix: '.exe'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - run: git submodule update --init --depth 1 vendor/json vendor/box3d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jrouwe/JoltPhysics
          ref: e77f175595e64cb44218cc9d9d56fc365ad0e36a
          path: .evaluation-jolt
          persist-credentials: false
      - name: Fetch exact compiled Jolt and pristine trajectory reference
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory allocation-evidence | Out-Null
          git rev-parse HEAD > allocation-evidence/ExecutedSource.txt
          $Expected = @{'42443610842'='fbcf62c7ce49baef9ba1ef2212c05878d908de8a'; '42444068279'='29a6473f598cfd801bb49ff021edd0cfcedce3ce'}
          foreach ($Run in @('42443610842', '42444068279')) {
            gh api "repos/gmoddev/gargantuan/actions/runs/$Run" > "allocation-evidence/Source-$Run.json"
            if ($LASTEXITCODE -ne 0) { throw 'Source metadata unavailable' }
            $Metadata = Get-Content "allocation-evidence/Source-$Run.json" -Raw | ConvertFrom-Json
            if ($Metadata.head_sha -ne $Expected[$Run] -or $Metadata.status -ne 'completed') { throw 'Source mismatch' }
            gh run download $Run --repo gmoddev/gargantuan --name 'jolt-schedule-energy-${{ matrix.os }}' --dir "source-$Run"
            if ($LASTEXITCODE -ne 0) { throw 'Compiled source unavailable' }
          }
          $Extension = if ($IsWindows) { 'lib' } else { 'a' }
          $Library = @(Get-ChildItem "source-42443610842/build-energy-clean/JoltBuild/*.$Extension")
          if ($Library.Count -ne 1) { throw 'Ambiguous compiled library' }
          "JOLT_CLEAN_LIB=$($Library[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-FileHash -LiteralPath $Library[0].FullName | ConvertTo-Json > allocation-evidence/ImportedJolt.json
          if (-not $IsWindows) { chmod +x source-42444068279/build-energy-clean/PhysicsJoltUnifiedCouplingQualification }
      - name: Build only the Linux allocation entrypoint against cached Jolt
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S experiments/PhysicsJoltEvaluation/DiagnosticJolt -B build-allocations -G Ninja -DCMAKE_BUILD_TYPE=Release -DDIAGNOSTIC_EXPECT_CLEAN=ON -DDIAGNOSTIC_PREBUILT_JOLT="$JOLT_CLEAN_LIB" -DDIAGNOSTIC_JOLT_ROOT="$GITHUB_WORKSPACE/.evaluation-jolt" -DEVALUATION_SOURCE_ROOT="$GITHUB_WORKSPACE" 2>&1 | tee allocation-evidence/Configure.log
          cmake --build build-allocations --target PhysicsJoltUnifiedCouplingAllocations --parallel 2 2>&1 | tee allocation-evidence/Build.log
      - name: Build only the Windows allocation entrypoint against cached Jolt
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VsWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $Installation = & $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $Installation) { throw 'MSVC toolchain unavailable' }
          $VsDev = Join-Path $Installation 'Common7\Tools\VsDevCmd.bat'
          cmd /c "call `"$VsDev`" -arch=x64 -host_arch=x64 && cmake -S experiments/PhysicsJoltEvaluation/DiagnosticJolt -B build-allocations -G Ninja -DCMAKE_BUILD_TYPE=Release -DDIAGNOSTIC_EXPECT_CLEAN=ON -DCMAKE_CXX_COMPILER=cl.exe -DCMAKE_C_COMPILER=cl.exe -DDIAGNOSTIC_PREBUILT_JOLT=`"$env:JOLT_CLEAN_LIB`" -DDIAGNOSTIC_JOLT_ROOT=`"$env:GITHUB_WORKSPACE\.evaluation-jolt`" -DEVALUATION_SOURCE_ROOT=`"$env:GITHUB_WORKSPACE`" && cmake --build build-allocations --target PhysicsJoltUnifiedCouplingAllocations --parallel 2" *> allocation-evidence/Build.log
          if ($LASTEXITCODE -ne 0) { Get-Content allocation-evidence/Build.log; throw 'Configure or build failed' }
      - name: Measure allocations separately and verify pristine physical parity
        run: >-
          python experiments/PhysicsJoltEvaluation/RunUnifiedAllocationPass.py
          --allocations build-allocations/PhysicsJoltUnifiedCouplingAllocations${{ matrix.suffix }}
          --pristine source-42444068279/build-energy-clean/PhysicsJoltUnifiedCouplingQualification${{ matrix.suffix }}
          --output allocation-evidence/Runs
      - name: Preserve allocation results and rejected controls
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: jolt-scheduled-allocations-${{ matrix.os }}
          path: |
            allocation-evidence/
            build-allocations/PhysicsJoltUnifiedCouplingAllocations${{ matrix.suffix }}
            build-allocations/CMakeCache.txt
            build-allocations/compile_commands.json

  contact-cadence-mechanism:
    if: github.event_name == 'workflow_dispatch' && inputs.schedule_followup_only && inputs.projection_causal_only
    name: Contact operation ledger and long-horizon schedule refinement
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - name: Fetch immutable observational binaries and prior scalar evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir cadence-evidence
          git rev-parse HEAD > cadence-evidence/ExecutedSource.txt
          for Run in 42434395381 42443610842 42444068279; do
            gh api "repos/gmoddev/gargantuan/actions/runs/$Run" > "cadence-evidence/Source-$Run.json"
          done
          python3 - <<'PY'
          import json,pathlib
          for R,S in [('42434395381','7615e55024a924388717a3af2a187812f86dc6d8'),('42443610842','fbcf62c7ce49baef9ba1ef2212c05878d908de8a'),('42444068279','29a6473f598cfd801bb49ff021edd0cfcedce3ce')]:
              D=json.loads(pathlib.Path('cadence-evidence',f'Source-{R}.json').read_text())
              assert D['head_sha']==S and D['status']=='completed'
          PY
          gh run download 42434395381 --repo gmoddev/gargantuan --name jolt-s1-instability-evidence --dir legacy
          gh run download 42443610842 --repo gmoddev/gargantuan --name jolt-schedule-energy-ubuntu-24.04 --dir scalar-reference
          gh run download 42444068279 --repo gmoddev/gargantuan --name jolt-schedule-energy-ubuntu-24.04 --dir native
          chmod +x legacy/build-s1-clean/PhysicsJoltNativeCouplingInstrumented legacy/build-s1-instrumented/PhysicsJoltNativeCouplingInstrumented native/build-energy-clean/PhysicsJoltScheduledCouplingDiagnostic native/build-energy-observed/PhysicsJoltScheduledCouplingDiagnostic
      - name: Attribute first C4/C8 contact-energy excursions by operation
        run: |
          python3 experiments/PhysicsJoltEvaluation/RunContactCadenceMechanism.py --clean legacy/build-s1-clean/PhysicsJoltNativeCouplingInstrumented --instrumented legacy/build-s1-instrumented/PhysicsJoltNativeCouplingInstrumented --reference scalar-reference/schedule-energy/Runs --output cadence-evidence/Operations
          for Case in C1 C2; do
            for Profile in C4I48 C8I24; do
              python3 experiments/PhysicsJoltEvaluation/AnalyzeContactCadencePhases.py --published "cadence-evidence/Operations/$Case-$Profile-Observed.jsonl" --trace "cadence-evidence/Operations/$Case-$Profile.trace.jsonl" --output "cadence-evidence/Operations/$Case-$Profile.Independent.json"
            done
          done
      - name: Test a finer soft timestep and doubled outer cadence without changing material
        run: >-
          python3 experiments/PhysicsJoltEvaluation/RunScheduleRefinement.py
          --pristine native/build-energy-clean/PhysicsJoltScheduledCouplingDiagnostic
          --observed native/build-energy-observed/PhysicsJoltScheduledCouplingDiagnostic
          --output cadence-evidence/Refinement
      - name: Preserve every operation trace and rejected refinement
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: jolt-contact-cadence-mechanism
          path: cadence-evidence/

