        with:
          repository: jrouwe/JoltPhysics
          ref: e77f175595e64cb44218cc9d9d56fc365ad0e36a
          path: .evaluation-jolt
          persist-credentials: false
      - name: Prepare Linux toolchain
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sudo apt-get update
