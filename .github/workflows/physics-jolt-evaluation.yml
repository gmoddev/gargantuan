          if-no-files-found: error
          path: |
            unified-qualified/
            build-unified-qualified/PhysicsJoltUnifiedCouplingQualification${{ matrix.suffix }}
            build-unified-qualified/CMakeCache.txt
            build-unified-qualified/compile_commands.json

  schedule-internal-energy:
    if: github.event_name == 'workflow_dispatch' && (inputs.schedule_energy_only || inputs.schedule_followup_only) && !inputs.solver_qualification_only && !inputs.projection_causal_only && !inputs.s1_followup_only
    name: Internal solver energy and pristine parity / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            suffix: ''
          - os: windows-2025-vs2026
            suffix: '.exe'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - run: git submodule update --init --depth 1 vendor/json vendor/box3d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jrouwe/JoltPhysics
          ref: e77f175595e64cb44218cc9d9d56fc365ad0e36a
          path: .evaluation-jolt
          persist-credentials: false
      - name: Preserve inputs and generate the isolated observational patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir schedule-energy
          git rev-parse HEAD > schedule-energy/ExecutedSource.txt
          git rev-parse 'HEAD^{tree}' > schedule-energy/ExecutedTree.txt
          git submodule status > schedule-energy/Submodules.txt
          python experiments/PhysicsJoltEvaluation/MakeEnergyObservation.py .evaluation-jolt schedule-energy/EnergyObservation.patch
          git -C .evaluation-jolt worktree add --detach ../.energy-jolt e77f175595e64cb44218cc9d9d56fc365ad0e36a
          git -C .energy-jolt apply "$GITHUB_WORKSPACE/schedule-energy/EnergyObservation.patch"
          git -C .energy-jolt diff --binary > schedule-energy/AppliedJolt.patch
      - name: Locate Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VsWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $Installation = & $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $Installation) { throw 'MSVC toolchain unavailable' }
          "VSDEVCMD=$(Join-Path $Installation 'Common7\Tools\VsDevCmd.bat')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Reuse exact compiled dependencies without rebuilding Jolt
        if: inputs.schedule_followup_only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.schedule_source_run }}
        run: |
          gh api "repos/gmoddev/gargantuan/actions/runs/$env:SOURCE_RUN" > schedule-energy/DependencySourceRun.json
          if ($LASTEXITCODE -ne 0) { throw 'Dependency run metadata unavailable' }
          $Source = Get-Content schedule-energy/DependencySourceRun.json -Raw | ConvertFrom-Json
          $Expected = switch ($env:SOURCE_RUN) {
            '42443610842' { 'fbcf62c7ce49baef9ba1ef2212c05878d908de8a' }
            '42444068279' { '29a6473f598cfd801bb49ff021edd0cfcedce3ce' }
            '42447487882' { '7c9e9d25371d382edeb4951d90b6a63f9cc413e3' }
            default { throw 'Unrecognized immutable compiled source' }
          }
          if ($Source.head_sha -ne $Expected -or $Source.status -ne 'completed') { throw 'Wrong compiled dependency source' }
          'SELECTED_WORLD_UPDATES=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'SELECTED_SOFT_ITERATIONS=24' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'SELECTED_VELOCITY_MODE=difference' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($env:SOURCE_RUN -eq '42447487882') {
            if ($Source.conclusion -ne 'success') { throw 'Native numerical ablation is not complete' }
            'SELECTED_WORLD_UPDATES=2' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            'SELECTED_SOFT_ITERATIONS=12' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            'SELECTED_VELOCITY_MODE=delta' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            'NUMERICAL_QUALIFICATION=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            gh run download 42444068279 --repo gmoddev/gargantuan --name 'jolt-schedule-energy-${{ matrix.os }}' --dir original-reference
            if ($LASTEXITCODE -ne 0) { throw 'Original unmodified control binary unavailable' }
            if ($IsWindows) {
              'NUMERICAL_BUILD=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              exit 0
            }
            gh run download $env:SOURCE_RUN --repo gmoddev/gargantuan --name jolt-native-velocity-ablation --dir prior-energy
            if ($LASTEXITCODE -ne 0) { throw 'Numerical binary artifact unavailable' }
            foreach ($Kind in @('clean', 'observed')) {
              $InputKind = if ($Kind -eq 'clean') { 'unobserved' } else { 'observed' }
              New-Item -ItemType Directory -Force "build-energy-$Kind" | Out-Null
              foreach ($Target in @('PhysicsJoltScheduledCouplingDiagnostic', 'PhysicsJoltUnifiedCouplingQualification')) {
                Copy-Item -LiteralPath "prior-energy/build-numerical-$InputKind/$Target" -Destination "build-energy-$Kind/$Target"
                Get-FileHash -LiteralPath "build-energy-$Kind/$Target" | ConvertTo-Json > "schedule-energy/ImportedBinary-$Kind-$Target.json"
              }
              Copy-Item -LiteralPath "prior-energy/numerical-evidence/Applied-$InputKind.patch" -Destination "schedule-energy/ExecutedNumerical-$Kind.patch"
            }
            chmod +x build-energy-clean/PhysicsJolt* build-energy-observed/PhysicsJolt* original-reference/build-energy-clean/PhysicsJoltScheduledCouplingDiagnostic
            'REUSE_BINARIES=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }
          gh run download $env:SOURCE_RUN --repo gmoddev/gargantuan --name 'jolt-schedule-energy-${{ matrix.os }}' --dir prior-energy
          if ($LASTEXITCODE -ne 0) { throw 'Compiled dependency artifact unavailable' }
          if ($env:SOURCE_RUN -eq '42444068279') {
            foreach ($Kind in @('clean', 'observed')) {
              New-Item -ItemType Directory -Force "build-energy-$Kind" | Out-Null
              foreach ($Target in @('PhysicsJoltScheduledCouplingDiagnostic', 'PhysicsJoltUnifiedCouplingQualification')) {
                $Name = "$Target${{ matrix.suffix }}"
                Copy-Item -LiteralPath "prior-energy/build-energy-$Kind/$Name" -Destination "build-energy-$Kind/$Name"
                Get-FileHash -LiteralPath "build-energy-$Kind/$Name" | ConvertTo-Json > "schedule-energy/ImportedBinary-$Kind-$Target.json"
              }
            }
            if (-not $IsWindows) { chmod +x build-energy-clean/PhysicsJolt* build-energy-observed/PhysicsJolt* }
            'REUSE_BINARIES=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }
          $Extension = if ($IsWindows) { 'lib' } else { 'a' }
          foreach ($Kind in @('clean', 'observed')) {
            $Library = @(Get-ChildItem "prior-energy/build-energy-$Kind/JoltBuild/*.$Extension")
            if ($Library.Count -ne 1) { throw 'Ambiguous compiled Jolt dependency' }
            $Variable = if ($Kind -eq 'clean') { 'JOLT_CLEAN_LIB' } else { 'JOLT_OBSERVED_LIB' }
            "$Variable=$($Library[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Get-FileHash -LiteralPath $Library[0].FullName | ConvertTo-Json > "schedule-energy/ImportedJolt-$Kind.json"
          }
      - name: Compile pristine and observer Linux targets
        if: runner.os != 'Windows' && env.REUSE_BINARIES != '1'
        shell: bash
        run: |
          set -euo pipefail
          c++ --version > schedule-energy/Compiler.txt
          lscpu > schedule-energy/Cpu.txt
          for Kind in clean observed; do
            Root=.evaluation-jolt; Clean=ON; Observer=OFF
            Library="${JOLT_CLEAN_LIB:-}"
            if [ "$Kind" = observed ]; then Root=.energy-jolt; Clean=OFF; Observer=ON; fi
            if [ "$Kind" = observed ]; then Library="${JOLT_OBSERVED_LIB:-}"; fi
            cmake -S experiments/PhysicsJoltEvaluation/DiagnosticJolt -B "build-energy-$Kind" -G Ninja -DCMAKE_BUILD_TYPE=Release -DDIAGNOSTIC_EXPECT_CLEAN="$Clean" -DDIAGNOSTIC_ENERGY_OBSERVER="$Observer" -DDIAGNOSTIC_PREBUILT_JOLT="$Library" -DDIAGNOSTIC_JOLT_ROOT="$GITHUB_WORKSPACE/$Root" -DEVALUATION_SOURCE_ROOT="$GITHUB_WORKSPACE" 2>&1 | tee "schedule-energy/Configure-$Kind.log"
            cmake --build "build-energy-$Kind" --target PhysicsJoltScheduledCouplingDiagnostic PhysicsJoltUnifiedCouplingQualification --parallel 2 2>&1 | tee "schedule-energy/Build-$Kind.log"
            cp "build-energy-$Kind/CMakeCache.txt" "schedule-energy/CMakeCache-$Kind.txt"
            cp "build-energy-$Kind/compile_commands.json" "schedule-energy/CompileCommands-$Kind.json"
          done
      - name: Compile pristine and observer Windows targets
        if: runner.os == 'Windows' && env.REUSE_BINARIES != '1' && env.NUMERICAL_BUILD != '1'
        shell: cmd
        run: |
          call "%VSDEVCMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cl /Bv > schedule-energy\Compiler.txt 2>&1
          cmake -S experiments/PhysicsJoltEvaluation/DiagnosticJolt -B build-energy-clean -G Ninja -DCMAKE_BUILD_TYPE=Release -DDIAGNOSTIC_EXPECT_CLEAN=ON -DCMAKE_CXX_COMPILER=cl.exe -DCMAKE_C_COMPILER=cl.exe -DDIAGNOSTIC_PREBUILT_JOLT="%JOLT_CLEAN_LIB%" -DDIAGNOSTIC_JOLT_ROOT="%CD%\.evaluation-jolt" -DEVALUATION_SOURCE_ROOT="%CD%" > schedule-energy\Configure-clean.log 2>&1
          if errorlevel 1 (type schedule-energy\Configure-clean.log & exit /b 1)
          cmake --build build-energy-clean --target PhysicsJoltScheduledCouplingDiagnostic PhysicsJoltUnifiedCouplingQualification --parallel 2 > schedule-energy\Build-clean.log 2>&1
          if errorlevel 1 (type schedule-energy\Build-clean.log & exit /b 1)
          cmake -S experiments/PhysicsJoltEvaluation/DiagnosticJolt -B build-energy-observed -G Ninja -DCMAKE_BUILD_TYPE=Release -DDIAGNOSTIC_EXPECT_CLEAN=OFF -DDIAGNOSTIC_ENERGY_OBSERVER=ON -DCMAKE_CXX_COMPILER=cl.exe -DCMAKE_C_COMPILER=cl.exe -DDIAGNOSTIC_PREBUILT_JOLT="%JOLT_OBSERVED_LIB%" -DDIAGNOSTIC_JOLT_ROOT="%CD%\.energy-jolt" -DEVALUATION_SOURCE_ROOT="%CD%" > schedule-energy\Configure-observed.log 2>&1
          if errorlevel 1 (type schedule-energy\Configure-observed.log & exit /b 1)
          cmake --build build-energy-observed --target PhysicsJoltScheduledCouplingDiagnostic PhysicsJoltUnifiedCouplingQualification --parallel 2 > schedule-energy\Build-observed.log 2>&1
          if errorlevel 1 (type schedule-energy\Build-observed.log & exit /b 1)
      - name: Independently build corrected numerical libraries on Windows
        if: runner.os == 'Windows' && env.NUMERICAL_BUILD == '1'
        shell: cmd
        run: |
          call "%VSDEVCMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cl /Bv > schedule-energy\Compiler.txt 2>&1
          python experiments/PhysicsJoltEvaluation/MakeDeltaVelocityInstrumentation.py .evaluation-jolt schedule-energy/DeltaVelocity.patch
          if errorlevel 1 exit /b 1
          git -C .evaluation-jolt worktree add --detach ../.numerical-clean e77f175595e64cb44218cc9d9d56fc365ad0e36a
          git -C .numerical-clean apply "%CD%/schedule-energy/DeltaVelocity.patch"
          if errorlevel 1 exit /b 1
          git -C .evaluation-jolt worktree add --detach ../.numerical-observed e77f175595e64cb44218cc9d9d56fc365ad0e36a
          git -C .numerical-observed apply "%CD%/schedule-energy/DeltaVelocity.patch"
          if errorlevel 1 exit /b 1
          git -C .numerical-observed apply "%CD%/schedule-energy/EnergyObservation.patch"
          if errorlevel 1 exit /b 1
          git -C .numerical-clean diff --binary > schedule-energy/ExecutedNumerical-clean.patch
          git -C .numerical-observed diff --binary > schedule-energy/ExecutedNumerical-observed.patch
          cmake -S experiments/PhysicsJoltEvaluation/DiagnosticJolt -B build-energy-clean -G Ninja -DCMAKE_BUILD_TYPE=Release -DDIAGNOSTIC_DELTA_VELOCITY=ON -DCMAKE_CXX_COMPILER=cl.exe -DCMAKE_C_COMPILER=cl.exe -DDIAGNOSTIC_JOLT_ROOT="%CD%\.numerical-clean" -DEVALUATION_SOURCE_ROOT="%CD%" > schedule-energy\Configure-clean.log 2>&1
          if errorlevel 1 (type schedule-energy\Configure-clean.log & exit /b 1)
          cmake --build build-energy-clean --target PhysicsJoltScheduledCouplingDiagnostic PhysicsJoltUnifiedCouplingQualification --parallel 2 > schedule-energy\Build-clean.log 2>&1
          if errorlevel 1 (type schedule-energy\Build-clean.log & exit /b 1)
          cmake -S experiments/PhysicsJoltEvaluation/DiagnosticJolt -B build-energy-observed -G Ninja -DCMAKE_BUILD_TYPE=Release -DDIAGNOSTIC_DELTA_VELOCITY=ON -DDIAGNOSTIC_ENERGY_OBSERVER=ON -DCMAKE_CXX_COMPILER=cl.exe -DCMAKE_C_COMPILER=cl.exe -DDIAGNOSTIC_JOLT_ROOT="%CD%\.numerical-observed" -DEVALUATION_SOURCE_ROOT="%CD%" > schedule-energy\Configure-observed.log 2>&1
          if errorlevel 1 (type schedule-energy\Configure-observed.log & exit /b 1)
          cmake --build build-energy-observed --target PhysicsJoltScheduledCouplingDiagnostic PhysicsJoltUnifiedCouplingQualification --parallel 2 > schedule-energy\Build-observed.log 2>&1
          if errorlevel 1 (type schedule-energy\Build-observed.log & exit /b 1)
      - name: Require long original-mode identity with the unmodified upstream binary
        if: env.NUMERICAL_QUALIFICATION == '1'
        run: >-
          python experiments/PhysicsJoltEvaluation/RunNativeVelocityAblation.py
          --patched build-energy-observed/PhysicsJoltScheduledCouplingDiagnostic${{ matrix.suffix }}
          --unobserved build-energy-clean/PhysicsJoltScheduledCouplingDiagnostic${{ matrix.suffix }}
          --pristine original-reference/build-energy-clean/PhysicsJoltScheduledCouplingDiagnostic${{ matrix.suffix }}
          --controls-only --output schedule-energy/OriginalModeControls
      - name: Measure every inner state and verify observer parity
