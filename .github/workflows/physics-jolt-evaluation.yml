          cmake -S experiments/PhysicsJoltEvaluation/DiagnosticJolt -B build-unified-qualified -G Ninja -DCMAKE_BUILD_TYPE=Release -DDIAGNOSTIC_EXPECT_CLEAN=ON -DDIAGNOSTIC_JOLT_ROOT="$GITHUB_WORKSPACE/.evaluation-jolt" -DEVALUATION_SOURCE_ROOT="$GITHUB_WORKSPACE" 2>&1 | tee unified-qualified/Configure.log
          cmake --build build-unified-qualified --target PhysicsJoltUnifiedCouplingQualification --parallel 2 2>&1 | tee unified-qualified/Build.log
      - name: Compile pristine unified runner on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VSDEVCMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          mkdir unified-qualified
          git rev-parse HEAD > unified-qualified\ExecutedSource.txt
          cl /Bv > unified-qualified\Compiler.txt 2>&1
          cmake -S experiments/PhysicsJoltEvaluation/DiagnosticJolt -B build-unified-qualified -G Ninja -DCMAKE_BUILD_TYPE=Release -DDIAGNOSTIC_EXPECT_CLEAN=ON -DCMAKE_CXX_COMPILER=cl.exe -DCMAKE_C_COMPILER=cl.exe -DDIAGNOSTIC_JOLT_ROOT="%CD%\.evaluation-jolt" -DEVALUATION_SOURCE_ROOT="%CD%" > unified-qualified\Configure.log 2>&1
          if errorlevel 1 (type unified-qualified\Configure.log & exit /b 1)
          cmake --build build-unified-qualified --target PhysicsJoltUnifiedCouplingQualification --parallel 2 > unified-qualified\Build.log 2>&1
          if errorlevel 1 (type unified-qualified\Build.log & exit /b 1)
      - name: Qualify all five fixtures and paired frame-only timing
        run: >-
          python experiments/PhysicsJoltEvaluation/RunUnifiedQualification.py
          --exe build-unified-qualified/PhysicsJoltUnifiedCouplingQualification${{ matrix.suffix }}
