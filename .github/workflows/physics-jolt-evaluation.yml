          if errorlevel 1 exit /b %errorlevel%
          mkdir engine-comparison
          cl /Bv > engine-comparison\Compiler.txt 2>&1
          cmake -S . -B build-engine-comparison -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl.exe -DCMAKE_C_COMPILER=cl.exe -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON -DGARGANTUAN_HEADLESS_GEOMETRY_QUALIFICATION=ON -DGARGANTUAN_TRACY=OFF -DGARGANTUAN_WITH_GNS=OFF -DBUILD_TESTING=OFF -DGARGANTUAN_BUILD_GLAZE_SERIALIZATION_PROTOTYPE=OFF -DGARGANTUAN_BUILD_PHYSICS_JOLT_EVALUATION=ON -DPHYSICS_EVALUATION_JOLT_ROOT="%CD%\.evaluation-jolt" > engine-comparison\Configure.log 2>&1
          if errorlevel 1 (type engine-comparison\Configure.log & exit /b 1)
          cmake --build build-engine-comparison --target PhysicsJoltUnifiedRigidEvaluation PhysicsJoltXpbdCouplingDiagnostic PhysicsJoltNativeCouplingDiagnostic --parallel 2 > engine-comparison\Build.log 2>&1
          if errorlevel 1 (type engine-comparison\Build.log & exit /b 1)
      - name: Run bounded regressions and matched corrected-coupling comparison
        run: >-
          python experiments/PhysicsJoltEvaluation/RunEngineComparison.py
          --build build-engine-comparison --jolt .evaluation-jolt --output engine-comparison/Runs
      - name: Preserve selected Engine comparison outputs and dependency metadata
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: jolt-engine-comparison-${{ matrix.os }}
          if-no-files-found: error
          path: |
            engine-comparison/
            build-engine-comparison/CMakeCache.txt
            build-engine-comparison/compile_commands.json
            build-engine-comparison/experiments/PhysicsJoltEvaluation/PhysicsJoltUnifiedRigidEvaluation*
            build-engine-comparison/experiments/PhysicsJoltEvaluation/PhysicsJoltXpbdCouplingDiagnostic*
            build-engine-comparison/experiments/PhysicsJoltEvaluation/PhysicsJoltNativeCouplingDiagnostic*
