            unified-evidence/
            build-unified/PhysicsJoltUnifiedCouplingQualification
            build-unified/CMakeCache.txt
            build-unified/compile_commands.json
            build-unified/JoltBuild/libJolt.a

  hard-compatibility-proof:
    if: github.event_name == 'workflow_dispatch' && (inputs.unified_screen_only || inputs.unified_qualification_only) && !inputs.schedule_followup_only
    name: Exact hard-constraint kinematic compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - name: Test hard compatibility and frozen initial prediction
        run: |
          set -euo pipefail
          mkdir compatibility-evidence
          git rev-parse HEAD > compatibility-evidence/ExecutedSource.txt
          python3 -m venv .compatibility-numeric
          .compatibility-numeric/bin/pip install --only-binary=:all: numpy==2.3.4 > compatibility-evidence/NumericInstall.txt
          python3 - <<'PY'
          import json,pathlib,struct
          G=json.loads(pathlib.Path('experiments/PhysicsJoltEvaluation/CausalFixtures/NativeOptimizedClothGraph.json').read_text())
          for Name,Keep in [('SingleDiagonal',lambda E:abs(E['I']-E['J'])!=12),('NoDiagonals',lambda E:abs(E['I']-E['J']) not in (12,14))]:
              pathlib.Path('compatibility-evidence',Name+'.json').write_text(json.dumps({**G,'Edges':[E for E in G['Edges'] if Keep(E)]}))
          C=struct.unpack('f',struct.pack('f',1e-5))[0]
          pathlib.Path('compatibility-evidence/Compliant.json').write_text(json.dumps({**G,'Edges':[{**E,'Compliance':C if E['Compliance']==0 else E['Compliance']} for E in G['Edges']]}))
          PY
          .compatibility-numeric/bin/python experiments/PhysicsJoltEvaluation/AnalyzeConstraintCompatibility.py \
            --graph experiments/PhysicsJoltEvaluation/CausalFixtures/NativeOptimizedClothGraph.json \
            --single-diagonal compatibility-evidence/SingleDiagonal.json \
            --no-diagonals compatibility-evidence/NoDiagonals.json \
            --compliant-graph compatibility-evidence/Compliant.json --output compatibility-evidence/Compatibility.json
      - name: Preserve exact compatibility witness
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: jolt-hard-compatibility-evidence
          if-no-files-found: error
          path: compatibility-evidence/

  unified-final-qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.unified_qualification_only && !inputs.schedule_followup_only
    name: All unified fixtures / quality and cost / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            suffix: ''
          - os: windows-2025-vs2026
            suffix: '.exe'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
