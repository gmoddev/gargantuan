  fixed-state-convergence:
    if: github.event_name == 'workflow_dispatch' && inputs.solver_qualification_only && !inputs.schedule_followup_only
    name: Fixed predicted-state convergence discriminator
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - run: git submodule update --init --depth 1 vendor/json
      - name: Build and apply sweeps to the same captured state
        run: |
          set -euo pipefail
          mkdir fixed-state-evidence
          git rev-parse HEAD > fixed-state-evidence/ExecutedSource.txt
          c++ -std=c++23 -O2 -ffp-contract=off -fno-fast-math -Ivendor/json/include experiments/PhysicsJoltEvaluation/ConvergedProjectionReplay.cpp -o fixed-state-evidence/Replay
          c++ -std=c++23 -O2 -ffp-contract=off -fno-fast-math -Ivendor/json/include experiments/PhysicsJoltEvaluation/ProbeProjectionConvergence.cpp -o fixed-state-evidence/Probe
          fixed-state-evidence/Replay --graph experiments/PhysicsJoltEvaluation/CausalFixtures/NativeOptimizedClothGraph.json --precision float --rest captured --steps 4 --frames 1 --stage-limit 58 --particles 1 --projection-iterations 1 > fixed-state-evidence/Stages.jsonl
          for Precision in float double; do
            fixed-state-evidence/Probe --graph experiments/PhysicsJoltEvaluation/CausalFixtures/NativeOptimizedClothGraph.json --stages fixed-state-evidence/Stages.jsonl --precision "$Precision" --rest captured --microstep 57 --sweeps 16384 > "fixed-state-evidence/$Precision.jsonl"
          done
      - name: Preserve fixed-state convergence evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
