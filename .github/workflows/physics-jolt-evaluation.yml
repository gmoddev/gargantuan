          mkdir engine-comparison
          clang++-19 --version > engine-comparison/Compiler.txt
          lscpu > engine-comparison/Cpu.txt
          cmake -S . -B build-engine-comparison -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 -DCMAKE_C_FLAGS=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14 -DCMAKE_CXX_FLAGS=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14 -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON -DGARGANTUAN_HEADLESS_GEOMETRY_QUALIFICATION=ON -DGARGANTUAN_TRACY=OFF -DGARGANTUAN_WITH_GNS=OFF -DBUILD_TESTING=OFF -DGARGANTUAN_BUILD_GLAZE_SERIALIZATION_PROTOTYPE=OFF -DGARGANTUAN_BUILD_PHYSICS_JOLT_EVALUATION=ON -DPHYSICS_EVALUATION_JOLT_ROOT="$GITHUB_WORKSPACE/.evaluation-jolt" 2>&1 | tee engine-comparison/Configure.log
          cmake --build build-engine-comparison --target PhysicsJoltUnifiedRigidEvaluation PhysicsJoltXpbdCouplingDiagnostic PhysicsJoltNativeCouplingDiagnostic --parallel 2 2>&1 | tee engine-comparison/Build.log
      - name: Build selected Engine comparison targets on Windows
