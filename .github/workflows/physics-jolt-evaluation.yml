          if-no-files-found: error
          path: fixed-state-evidence/

  unified-quality-screen:
    if: github.event_name == 'workflow_dispatch' && inputs.unified_screen_only
    name: Pristine unified Jolt broader accepted-state quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - run: git submodule update --init --depth 1 vendor/json vendor/box3d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
