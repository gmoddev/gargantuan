name: Experimental physics comparison

on:
  pull_request:
    paths:
      - 'experiments/PhysicsJoltEvaluation/**'
      - '.github/workflows/physics-jolt-evaluation.yml'
      - 'CMakeLists.txt'
  workflow_dispatch:
    inputs:
      s1_diagnostic_only:
        description: Isolated S1 and projection instability investigation; no qualification or full comparison
        type: boolean
        default: false
      s1_followup_only:
        description: Follow up run 42434395381 with contact-position and precision controls only
        type: boolean
        default: false
      projection_causal_only:
        description: Standalone nonlinear projection replay and small reproducer only; no Jolt build
        type: boolean
        default: false
      solver_resolution_only:
        description: Pristine same-soft-budget coupling schedules and converged constraint tests only
        type: boolean
        default: false
      solver_qualification_only:
        description: Independently qualify the measured U48 material profile on Linux and Windows
        type: boolean
        default: false
      unified_screen_only:
        description: Broader pristine unified Jolt fixtures with accepted-state and measured-work gates
        type: boolean
        default: false
      unified_qualification_only:
        description: Final unified fixture qualification and bounded Engine/XPBD architecture comparison
        type: boolean
        default: false
      schedule_energy_only:
        description: Internal energy, pristine parity and production-stiffness schedule tests
        type: boolean
        default: false
      schedule_followup_only:
        description: Reuse exact compiled Jolt dependencies and retry broader schedule fixtures
        type: boolean
        default: false
      schedule_source_run:
        description: Immutable compiled dependency run for schedule followup
        type: string
        default: '42443610842'

permissions:
  contents: read
  actions: read

concurrency:
  group: physics-evaluation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-release-comparison:
    if: github.event_name != 'workflow_dispatch' || (!inputs.s1_diagnostic_only && !inputs.s1_followup_only && !inputs.projection_causal_only && !inputs.solver_resolution_only && !inputs.solver_qualification_only && !inputs.unified_screen_only && !inputs.unified_qualification_only && !inputs.schedule_energy_only && !inputs.schedule_followup_only)
    name: Ubuntu Release / experimental quality and timing
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      SDL_VIDEODRIVER: dummy
    steps:
      - name: Checkout recursive Engine dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Checkout pinned Jolt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: jrouwe/JoltPhysics
          ref: e77f175595e64cb44218cc9d9d56fc365ad0e36a
          path: .evaluation-jolt
          persist-credentials: false
      - name: Verify source and merged-main qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir evaluation-evidence
          git rev-parse HEAD > evaluation-evidence/executed-source.txt
          git rev-parse 'HEAD^{tree}' > evaluation-evidence/executed-tree.txt
          git submodule status --recursive > evaluation-evidence/submodules.txt
          if grep -Eq '^[\-+U]' evaluation-evidence/submodules.txt; then exit 1; fi
          git merge-base --is-ancestor 5b6782e35c4e24fd80bc8d5526104c615c72d84d HEAD
          for Run in 42376227131 42376227145; do
            gh api "repos/gmoddev/gargantuan/actions/runs/$Run" > "evaluation-evidence/main-prerequisite-$Run.json"
          done
          python3 - <<'PY'
          import json, pathlib
          for Path in pathlib.Path('evaluation-evidence').glob('main-prerequisite-*.json'):
              Run = json.loads(Path.read_text())
              assert Run['head_sha'] == '5b6782e35c4e24fd80bc8d5526104c615c72d84d'
              assert Run['status'] == 'completed' and Run['conclusion'] == 'success', 'Exact merged-main qualification is not complete'
          PY
      - name: Install controlled Release dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-19 clang-format g++-14 cmake ninja-build \
            libfreetype-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev
          clang++-19 --version > evaluation-evidence/compiler.txt
          lscpu > evaluation-evidence/cpu.txt
      - name: Install pinned repository tools
        uses: paradoxum-games/setup-rokit@c6a9749169e3a0146019b899cd0342556f773908 # v3
        with:
          version: 1.2.0
          cache: true
      - name: Generate current reflection sources
        run: lute tools/classgen
      - name: Configure Release comparison
        run: |
          set -euo pipefail
          cmake -S . -B build-evaluation -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_C_FLAGS=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14 \
            -DCMAKE_CXX_FLAGS=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14 \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON -DGARGANTUAN_HEADLESS_GEOMETRY_QUALIFICATION=ON \
            -DGARGANTUAN_TRACY=OFF -DGARGANTUAN_WITH_GNS=OFF -DBUILD_TESTING=ON \
            -DGARGANTUAN_BUILD_GLAZE_SERIALIZATION_PROTOTYPE=OFF \
            -DGARGANTUAN_BUILD_PHYSICS_JOLT_EVALUATION=ON \
            -DPHYSICS_EVALUATION_JOLT_ROOT="$GITHUB_WORKSPACE/.evaluation-jolt" \
            2>&1 | tee evaluation-evidence/configure.log
      - name: Build finite comparison targets
        id: build
        run: |
          set -euo pipefail
          cmake --build build-evaluation --parallel 2 --target \
            PhysicsJoltRigidEvaluation PhysicsJoltSoftEvaluation PhysicsJoltCouplingEvaluation \
            PhysicsJoltRigidEvaluationAllocations PhysicsJoltSoftEvaluationAllocations PhysicsJoltCouplingEvaluationAllocations \
            2>&1 | tee evaluation-evidence/build.log
      - name: Collect three-process Release measurements and quality gates
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 experiments/PhysicsJoltEvaluation/RunEvaluation.py --build build-evaluation \
            --jolt .evaluation-jolt --output evaluation-evidence/Release --mode full --repeats 3
      - name: Collect separate allocation pass
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 experiments/PhysicsJoltEvaluation/RunEvaluation.py --build build-evaluation \
            --jolt .evaluation-jolt --output evaluation-evidence/Allocations --mode allocations
      - name: Retain raw successes and failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: experimental-physics-linux-evidence
          if-no-files-found: error
          path: |
            evaluation-evidence/
            build-evaluation/CMakeCache.txt
            build-evaluation/compile_commands.json
            build-evaluation/CMakeFiles/CMakeConfigureLog.yaml

  s1-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.s1_diagnostic_only && !inputs.s1_followup_only
    name: Isolated native S1 causal probes / no production qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - name: Fetch only the two header dependencies
        run: git submodule update --init --depth 1 vendor/json vendor/box3d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jrouwe/JoltPhysics
          ref: e77f175595e64cb44218cc9d9d56fc365ad0e36a
          path: .evaluation-jolt
          persist-credentials: false
      - name: Preserve exact inputs and prepare isolated diagnostic worktree
        run: |
          mkdir s1-evidence
          git rev-parse HEAD > s1-evidence/ExecutedSource.txt
          git rev-parse 'HEAD^{tree}' > s1-evidence/ExecutedTree.txt
          git submodule status > s1-evidence/Submodules.txt
          c++ --version > s1-evidence/Compiler.txt
          lscpu > s1-evidence/Cpu.txt
          python3 experiments/PhysicsJoltEvaluation/MakeJoltInstrumentation.py .evaluation-jolt s1-evidence/GeneratedS1.patch --s1
          cmp s1-evidence/GeneratedS1.patch experiments/PhysicsJoltEvaluation/JoltS1Instrumentation.patch
          git -C .evaluation-jolt worktree add --detach ../.s1-jolt e77f175595e64cb44218cc9d9d56fc365ad0e36a
          git -C .s1-jolt apply "$GITHUB_WORKSPACE/s1-evidence/GeneratedS1.patch"
          git -C .s1-jolt diff --binary > s1-evidence/AppliedJolt.patch
      - name: Build pristine native control and isolated diagnostic
        run: |
          set -euo pipefail
          for Kind in clean instrumented; do
            Root=.evaluation-jolt; Clean=ON
            if [ "$Kind" = instrumented ]; then Root=.s1-jolt; Clean=OFF; fi
            cmake -S experiments/PhysicsJoltEvaluation/DiagnosticJolt -B "build-s1-$Kind" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DDIAGNOSTIC_EXPECT_CLEAN="$Clean" \
              -DDIAGNOSTIC_JOLT_ROOT="$GITHUB_WORKSPACE/$Root" -DEVALUATION_SOURCE_ROOT="$GITHUB_WORKSPACE" \
              2>&1 | tee "s1-evidence/Configure-$Kind.log"
            cmake --build "build-s1-$Kind" --target PhysicsJoltNativeCouplingInstrumented --parallel 2 \
              2>&1 | tee "s1-evidence/Build-$Kind.log"
            cp "build-s1-$Kind/CMakeCache.txt" "s1-evidence/CMakeCache-$Kind.txt"
            cp "build-s1-$Kind/compile_commands.json" "s1-evidence/CompileCommands-$Kind.json"
          done
      - name: Run bounded S1 and free-cloth controls
        run: |
          python3 experiments/PhysicsJoltEvaluation/RunS1Investigation.py \
            --clean build-s1-clean/PhysicsJoltNativeCouplingInstrumented \
            --instrumented build-s1-instrumented/PhysicsJoltNativeCouplingInstrumented --output s1-evidence/Runs
      - name: Predict and excite projection modes in native Jolt
        run: |
          python3 -m venv .s1-numeric
          .s1-numeric/bin/pip install --only-binary=:all: numpy==2.3.4 > s1-evidence/NumericInstall.txt
          .s1-numeric/bin/python experiments/PhysicsJoltEvaluation/RunProjectionFollowup.py \
            --instrumented build-s1-instrumented/PhysicsJoltNativeCouplingInstrumented --runs s1-evidence/Runs
      - name: Retain causal evidence and native binaries
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: jolt-s1-instability-evidence
          if-no-files-found: error
          path: |
            s1-evidence/
            build-s1-clean/PhysicsJoltNativeCouplingInstrumented
            build-s1-instrumented/PhysicsJoltNativeCouplingInstrumented

  s1-followup:
    if: github.event_name == 'workflow_dispatch' && inputs.s1_followup_only && !inputs.s1_diagnostic_only && !inputs.schedule_followup_only
    name: Contact-position and precision causality / no qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - run: git submodule update --init --depth 1 vendor/json vendor/box3d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jrouwe/JoltPhysics
          ref: e77f175595e64cb44218cc9d9d56fc365ad0e36a
          path: .evaluation-jolt
          persist-credentials: false
      - name: Retain prior immutable evidence and prepare new diagnostic source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir followup-evidence
          gh api repos/gmoddev/gargantuan/actions/runs/42434395381 > followup-evidence/BaselineRun.json
          python3 -c "import json; R=json.load(open('followup-evidence/BaselineRun.json')); assert R['head_sha']=='7615e55024a924388717a3af2a187812f86dc6d8' and R['conclusion']=='success'"
          gh run download 42434395381 --repo gmoddev/gargantuan --name jolt-s1-instability-evidence --dir baseline
          git rev-parse HEAD > followup-evidence/ExecutedSource.txt
          c++ --version > followup-evidence/Compiler.txt
          python3 experiments/PhysicsJoltEvaluation/MakeJoltInstrumentation.py .evaluation-jolt followup-evidence/Generated.patch --s1
          cmp followup-evidence/Generated.patch experiments/PhysicsJoltEvaluation/JoltS1Instrumentation.patch
          git -C .evaluation-jolt apply "$GITHUB_WORKSPACE/followup-evidence/Generated.patch"
      - name: Build only the changed native diagnostic and standalone precision replay
        run: |
          set -euo pipefail
          cmake -S experiments/PhysicsJoltEvaluation/DiagnosticJolt -B build-followup -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DDIAGNOSTIC_JOLT_ROOT="$GITHUB_WORKSPACE/.evaluation-jolt" \
            -DEVALUATION_SOURCE_ROOT="$GITHUB_WORKSPACE" 2>&1 | tee followup-evidence/Configure.log
          cmake --build build-followup --target PhysicsJoltNativeCouplingInstrumented --parallel 2 2>&1 | tee followup-evidence/Build.log
          c++ -std=c++23 -O2 -ffp-contract=off -fno-fast-math -Ivendor/json/include \
            experiments/PhysicsJoltEvaluation/ProjectionPrecisionReplay.cpp -o build-followup/ProjectionPrecisionReplay \
            2>&1 | tee followup-evidence/ReplayBuild.log
          cp build-followup/CMakeCache.txt followup-evidence/
          cp build-followup/compile_commands.json followup-evidence/
      - name: Run only new causal controls with original thresholds
        run: |
          python3 experiments/PhysicsJoltEvaluation/RunS1Followup.py \
            --instrumented build-followup/PhysicsJoltNativeCouplingInstrumented \
            --replay build-followup/ProjectionPrecisionReplay \
            --baseline baseline/s1-evidence/Runs --output followup-evidence/Runs
      - name: Preserve new results independently of the baseline
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: jolt-s1-followup-evidence
          if-no-files-found: error
          path: |
            followup-evidence/
            build-followup/PhysicsJoltNativeCouplingInstrumented
            build-followup/ProjectionPrecisionReplay

  projection-causality:
    if: github.event_name == 'workflow_dispatch' && inputs.projection_causal_only && !inputs.s1_diagnostic_only && !inputs.s1_followup_only && !inputs.schedule_followup_only
    name: Standalone nonlinear geometry and edge-work analysis / no qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - run: git submodule update --init --depth 1 vendor/json
      - name: Build one standalone replay source
        run: |
          set -euo pipefail
          mkdir projection-evidence
          git rev-parse HEAD > projection-evidence/ExecutedSource.txt
          c++ --version > projection-evidence/Compiler.txt
          c++ -std=c++23 -O2 -ffp-contract=off -fno-fast-math -Ivendor/json/include \
            experiments/PhysicsJoltEvaluation/ProjectionPrecisionReplay.cpp -o projection-evidence/ProjectionPrecisionReplay \
            2>&1 | tee projection-evidence/Build.log
      - name: Run bounded geometric controls and ordered-edge work trace
        run: |
          python3 experiments/PhysicsJoltEvaluation/RunProjectionCausality.py \
            --replay projection-evidence/ProjectionPrecisionReplay --output projection-evidence/Runs
      - name: Analyze the nonlinear Jacobian at preserved native states
        run: |
          python3 -m venv .projection-numeric
          .projection-numeric/bin/pip install --only-binary=:all: numpy==2.3.4 > projection-evidence/NumericInstall.txt
          .projection-numeric/bin/python experiments/PhysicsJoltEvaluation/AnalyzeDeformedProjection.py \
            --graph experiments/PhysicsJoltEvaluation/CausalFixtures/NativeOptimizedClothGraph.json \
            --snapshots experiments/PhysicsJoltEvaluation/CausalFixtures/NativeNonlinearSnapshots.json \
            --output projection-evidence/DeformedProjection.json
      - name: Preserve standalone evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: jolt-projection-causality-evidence
          if-no-files-found: error
          path: projection-evidence/

  pristine-schedule-resolution:
    if: github.event_name == 'workflow_dispatch' && inputs.solver_resolution_only
    name: Pristine Jolt reciprocal microstep resolution
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - run: git submodule update --init --depth 1 vendor/json vendor/box3d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jrouwe/JoltPhysics
          ref: e77f175595e64cb44218cc9d9d56fc365ad0e36a
          path: .evaluation-jolt
          persist-credentials: false
      - name: Build only pristine native Jolt probe
        run: |
          set -euo pipefail
          mkdir resolution-evidence
          git rev-parse HEAD > resolution-evidence/ExecutedSource.txt
          c++ --version > resolution-evidence/Compiler.txt
          cmake -S experiments/PhysicsJoltEvaluation/DiagnosticJolt -B build-resolution -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DDIAGNOSTIC_EXPECT_CLEAN=ON \
            -DDIAGNOSTIC_JOLT_ROOT="$GITHUB_WORKSPACE/.evaluation-jolt" -DEVALUATION_SOURCE_ROOT="$GITHUB_WORKSPACE" \
            2>&1 | tee resolution-evidence/Configure.log
          cmake --build build-resolution --target PhysicsJoltNativeCouplingInstrumented --parallel 2 \
            2>&1 | tee resolution-evidence/Build.log
      - name: Execute the next causal tests and fail-closed energy calibration
        run: |
          python3 experiments/PhysicsJoltEvaluation/RunSolverResolution.py \
            --native build-resolution/PhysicsJoltNativeCouplingInstrumented --output resolution-evidence/Runs
      - name: Preserve all candidate successes and failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: jolt-pristine-resolution-evidence
          if-no-files-found: error
          path: |
            resolution-evidence/
            build-resolution/PhysicsJoltNativeCouplingInstrumented
            build-resolution/CMakeCache.txt
            build-resolution/compile_commands.json

  converged-constraint-resolution:
    if: github.event_name == 'workflow_dispatch' && inputs.solver_resolution_only
    name: Converged hard and compliant constraint controls
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - run: git submodule update --init --depth 1 vendor/json
      - name: Build one standalone converged replay
        run: |
          set -euo pipefail
          mkdir convergence-evidence
          git rev-parse HEAD > convergence-evidence/ExecutedSource.txt
          c++ -std=c++23 -O2 -ffp-contract=off -fno-fast-math -Ivendor/json/include \
            experiments/PhysicsJoltEvaluation/ConvergedProjectionReplay.cpp -o convergence-evidence/ConvergedProjectionReplay \
            2>&1 | tee convergence-evidence/Build.log
      - name: Test multiplier-retaining convergence at the same integration timestep
        run: |
          python3 experiments/PhysicsJoltEvaluation/RunConvergedProjection.py \
            --exe convergence-evidence/ConvergedProjectionReplay \
            --graph experiments/PhysicsJoltEvaluation/CausalFixtures/NativeOptimizedClothGraph.json \
            --output convergence-evidence/Runs
      - name: Preserve residual, energy and failed-convergence evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: jolt-converged-resolution-evidence
          if-no-files-found: error
          path: convergence-evidence/

  independent-profile-qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.solver_qualification_only && !inputs.schedule_followup_only
    name: U48 quality, repeats and worker budgets / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            suffix: ''
          - os: windows-2025-vs2026
            suffix: '.exe'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - run: git submodule update --init --depth 1 vendor/json vendor/box3d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jrouwe/JoltPhysics
          ref: e77f175595e64cb44218cc9d9d56fc365ad0e36a
          path: .evaluation-jolt
          persist-credentials: false
      - name: Locate Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VsWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $Installation = & $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $Installation) { throw 'MSVC toolchain unavailable' }
          "VSDEVCMD=$(Join-Path $Installation 'Common7\Tools\VsDevCmd.bat')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build pristine native Linux qualification
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir native-qualification
          git rev-parse HEAD > native-qualification/ExecutedSource.txt
          c++ --version > native-qualification/Compiler.txt
          lscpu > native-qualification/Cpu.txt
          cmake -S experiments/PhysicsJoltEvaluation/DiagnosticJolt -B build-native-qualified -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DDIAGNOSTIC_EXPECT_CLEAN=ON \
            -DDIAGNOSTIC_JOLT_ROOT="$GITHUB_WORKSPACE/.evaluation-jolt" -DEVALUATION_SOURCE_ROOT="$GITHUB_WORKSPACE" \
            2>&1 | tee native-qualification/Configure.log
          cmake --build build-native-qualified --target PhysicsJoltNativeCouplingInstrumented --parallel 2 \
            2>&1 | tee native-qualification/Build.log
      - name: Build pristine native Windows qualification
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VSDEVCMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          mkdir native-qualification
          git rev-parse HEAD > native-qualification\ExecutedSource.txt
          cl /Bv > native-qualification\Compiler.txt 2>&1
          cmake -S experiments/PhysicsJoltEvaluation/DiagnosticJolt -B build-native-qualified -G Ninja -DCMAKE_BUILD_TYPE=Release -DDIAGNOSTIC_EXPECT_CLEAN=ON -DCMAKE_CXX_COMPILER=cl.exe -DCMAKE_C_COMPILER=cl.exe -DDIAGNOSTIC_JOLT_ROOT="%CD%\.evaluation-jolt" -DEVALUATION_SOURCE_ROOT="%CD%" > native-qualification\Configure.log 2>&1
          if errorlevel 1 (type native-qualification\Configure.log & exit /b 1)
          cmake --build build-native-qualified --target PhysicsJoltNativeCouplingInstrumented --parallel 2 > native-qualification\Build.log 2>&1
          if errorlevel 1 (type native-qualification\Build.log & exit /b 1)
      - name: Run every accepted-state bound, independent repeat and timing parity
        run: >-
          python experiments/PhysicsJoltEvaluation/RunPristineQualification.py
          --native build-native-qualified/PhysicsJoltNativeCouplingInstrumented${{ matrix.suffix }}
          --output native-qualification/Runs
      - name: Preserve native qualification and rejected controls
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: jolt-profile-qualification-${{ matrix.os }}
          if-no-files-found: error
          path: |
            native-qualification/
            build-native-qualified/PhysicsJoltNativeCouplingInstrumented${{ matrix.suffix }}
