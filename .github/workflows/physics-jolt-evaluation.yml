  numerical-native-ablation:
    if: github.event_name == 'workflow_dispatch' && inputs.schedule_followup_only && inputs.s1_followup_only
    name: Native numerical reconstruction ablation / isolated upstream patch
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - run: git submodule update --init --depth 1 vendor/json vendor/box3d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jrouwe/JoltPhysics
          ref: e77f175595e64cb44218cc9d9d56fc365ad0e36a
          path: .evaluation-jolt
          persist-credentials: false
      - name: Preserve inputs and generate the two-file numerical patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir numerical-evidence
          git rev-parse HEAD > numerical-evidence/ExecutedSource.txt
          c++ --version > numerical-evidence/Compiler.txt
          lscpu > numerical-evidence/Cpu.txt
          gh api repos/gmoddev/gargantuan/actions/runs/42444068279 > numerical-evidence/PristineSource.json
          python3 -c "import json;D=json.load(open('numerical-evidence/PristineSource.json'));assert D['head_sha']=='29a6473f598cfd801bb49ff021edd0cfcedce3ce' and D['status']=='completed'"
          gh run download 42444068279 --repo gmoddev/gargantuan --name jolt-schedule-energy-ubuntu-24.04 --dir pristine
          chmod +x pristine/build-energy-clean/PhysicsJoltScheduledCouplingDiagnostic
          python3 experiments/PhysicsJoltEvaluation/MakeDeltaVelocityInstrumentation.py .evaluation-jolt numerical-evidence/DeltaVelocity.patch
          python3 experiments/PhysicsJoltEvaluation/MakeEnergyObservation.py .evaluation-jolt numerical-evidence/EnergyObservation.patch
      - name: Build separate pure and observed numerical libraries
        run: |
          set -euo pipefail
          for Kind in unobserved observed; do
            git -C .evaluation-jolt worktree add --detach "../.numerical-$Kind" e77f175595e64cb44218cc9d9d56fc365ad0e36a
            git -C ".numerical-$Kind" apply "$GITHUB_WORKSPACE/numerical-evidence/DeltaVelocity.patch"
            Observer=OFF
            if [ "$Kind" = observed ]; then
              git -C ".numerical-$Kind" apply "$GITHUB_WORKSPACE/numerical-evidence/EnergyObservation.patch"
              Observer=ON
            fi
            git -C ".numerical-$Kind" diff --binary > "numerical-evidence/Applied-$Kind.patch"
            cmake -S experiments/PhysicsJoltEvaluation/DiagnosticJolt -B "build-numerical-$Kind" -G Ninja -DCMAKE_BUILD_TYPE=Release -DDIAGNOSTIC_DELTA_VELOCITY=ON -DDIAGNOSTIC_ENERGY_OBSERVER="$Observer" -DDIAGNOSTIC_JOLT_ROOT="$GITHUB_WORKSPACE/.numerical-$Kind" -DEVALUATION_SOURCE_ROOT="$GITHUB_WORKSPACE" 2>&1 | tee "numerical-evidence/Configure-$Kind.log"
            cmake --build "build-numerical-$Kind" --parallel 2 --target PhysicsJoltScheduledCouplingDiagnostic PhysicsJoltUnifiedCouplingQualification 2>&1 | tee "numerical-evidence/Build-$Kind.log"
            cp "build-numerical-$Kind/compile_commands.json" "numerical-evidence/CompileCommands-$Kind.json"
            cp "build-numerical-$Kind/CMakeCache.txt" "numerical-evidence/CMakeCache-$Kind.txt"
          done
      - name: Compare source-preserving control and both numerical counterfactuals
        run: >-
          python3 experiments/PhysicsJoltEvaluation/RunNativeVelocityAblation.py
          --patched build-numerical-observed/PhysicsJoltScheduledCouplingDiagnostic
          --unobserved build-numerical-unobserved/PhysicsJoltScheduledCouplingDiagnostic
          --pristine pristine/build-energy-clean/PhysicsJoltScheduledCouplingDiagnostic
          --output numerical-evidence/Runs
      - name: Preserve all successes, numerical failures and independent binaries
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: jolt-native-velocity-ablation
          path: |
            numerical-evidence/
            build-numerical-unobserved/PhysicsJoltScheduledCouplingDiagnostic
            build-numerical-unobserved/PhysicsJoltUnifiedCouplingQualification
            build-numerical-observed/PhysicsJoltScheduledCouplingDiagnostic
            build-numerical-observed/PhysicsJoltUnifiedCouplingQualification
            build-numerical-unobserved/JoltBuild/libJolt.a
            build-numerical-observed/JoltBuild/libJolt.a

