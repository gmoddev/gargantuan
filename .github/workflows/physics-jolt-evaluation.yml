            -DDIAGNOSTIC_JOLT_ROOT="$GITHUB_WORKSPACE/.evaluation-jolt" -DEVALUATION_SOURCE_ROOT="$GITHUB_WORKSPACE" \
            2>&1 | tee unified-evidence/Configure.log
          cmake --build build-unified --target PhysicsJoltUnifiedCouplingQualification --parallel 2 \
            2>&1 | tee unified-evidence/Build.log
      - name: Evaluate all five coupling fixtures at justified candidate cadences
        run: |
          python3 experiments/PhysicsJoltEvaluation/RunUnifiedScreen.py \
            --exe build-unified/PhysicsJoltUnifiedCouplingQualification --output unified-evidence/Runs
      - name: Preserve full quality screen and compiled dependency cache
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: jolt-unified-screen-evidence
