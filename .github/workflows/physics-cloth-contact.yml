name: Experimental cloth contact screen
on:
  push:
    branches: [experiment/jolt-cloth-contact-correction-20261109]
    paths:
      - '.github/workflows/physics-cloth-contact.yml'
      - 'experiments/PhysicsJoltEvaluation/ContactQualification/RunScreen.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contact:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      SDL_VIDEODRIVER: dummy
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: GantriaEngine/JoltPhysics
          ref: 6ce0135b5be5a1e2e62a5b94cba3cece70b161d1
          path: .provider-jolt
          persist-credentials: false
      - name: Enable MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Installation = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$Installation\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          Get-ChildItem Env: | ForEach-Object { "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV }
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-19 g++-14 ninja-build libclang-rt-19-dev libfreetype-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev
      - uses: paradoxum-games/setup-rokit@c6a9749169e3a0146019b899cd0342556f773908
        with:
          version: 1.2.0
          cache: true
      - name: Compare frozen and experimental contact orders
        run: python experiments/PhysicsJoltEvaluation/ContactQualification/RunScreen.py
      - name: Preserve successful and failed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloth-contact-${{ matrix.os }}
          path: contact-evidence/
          if-no-files-found: error
