name: Jolt selective coupling qualification
on:
  push:
    branches: [experiment/jolt-optimized-foundation-20261108]
    paths:
      - 'experiments/PhysicsJoltEvaluation/Optimization/**'
      - 'experiments/PhysicsJoltEvaluation/Foundation/RunOptimization.py'
      - '.github/workflows/physics-jolt-optimization.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selective:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: git submodule update --init vendor/json vendor/box3d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: GantriaEngine/JoltPhysics
          ref: 109be79fa82be0b306c56e4b4357675ed7843767
          path: .foundation-jolt
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jrouwe/JoltPhysics
          ref: e77f175595e64cb44218cc9d9d56fc365ad0e36a
          path: .stock-jolt
          persist-credentials: false
      - name: Enable MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Installation = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$Installation\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          Get-ChildItem Env: | ForEach-Object { "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV }
      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-19 g++-14 ninja-build
      - name: Build profile and qualify selective coupling
        run: python experiments/PhysicsJoltEvaluation/Foundation/RunOptimization.py
      - name: Preserve raw successes and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jolt-selective-${{ matrix.os }}
          path: optimization-evidence/
          if-no-files-found: error
