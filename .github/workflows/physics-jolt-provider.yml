name: Experimental shared Jolt Engine provider
on:
  workflow_dispatch:
    inputs:
      SolverProfile:
        description: Exact experimental provider and Jolt profile
        type: choice
        options: [baseline, convergence, sleep-clock]
        default: baseline
      JoltCommit:
        description: Optional exact 40-character GantriaEngine/JoltPhysics final candidate; omit for the historical provider profile
        type: string
        required: false
      GroupBatch:
        description: Large-cloth grouping batch when JoltCommit is supplied
        type: choice
        options: ['256', '512', '1024']
        default: '256'
permissions:
  contents: read
jobs:
  provider:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      GANTRIA_ATTACHMENT_QUALIFICATION: '1'
      GANTRIA_PROVIDER_CONVERGENCE: ${{ inputs.SolverProfile != 'baseline' && github.event_name == 'workflow_dispatch' && '1' || '0' }}
      GANTRIA_PROVIDER_SLEEP_FIX: ${{ inputs.SolverProfile == 'sleep-clock' && '1' || '0' }}
      SDL_VIDEODRIVER: dummy
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: GantriaEngine/JoltPhysics
          ref: ${{ inputs.JoltCommit || inputs.SolverProfile == 'sleep-clock' && 'd8c46588b23700d24ebdaeada0ff460d34b1f830' || inputs.SolverProfile == 'convergence' && 'e167ba589787fb76f5d9718ae348d4ac1c3b19ee' || 'cd095d408a1cd231ad43fa8725d06a818fd63b13' }}
          path: .provider-jolt
          persist-credentials: false
      - name: Enable MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Installation = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$Installation\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          Get-ChildItem Env: | ForEach-Object { "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV }
      - name: Install Linux compiler and native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-19 clang-format g++-14 ninja-build libclang-rt-19-dev libfreetype-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev
      - uses: paradoxum-games/setup-rokit@c6a9749169e3a0146019b899cd0342556f773908
        with:
          version: 1.2.0
          cache: true
      - name: Build and qualify historical Engine-integrated provider
        if: inputs.JoltCommit == ''
        run: python experiments/PhysicsJoltEvaluation/Provider/RunQualification.py
      - name: Build and qualify final Engine provider, cache and cadence
        if: inputs.JoltCommit != ''
        env:
          GANTRIA_FINAL_JOLT_COMMIT: ${{ inputs.JoltCommit }}
          GANTRIA_PROVIDER_CONVERGENCE: '1'
          GANTRIA_PROVIDER_SLEEP_FIX: '1'
          GANTRIA_PROVIDER_GROUP_BATCH: ${{ inputs.GroupBatch }}
        run: python experiments/PhysicsJoltEvaluation/Provider/RunQualification.py
      - name: Retain successes and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jolt-provider-${{ matrix.os }}
          path: provider-evidence/
          if-no-files-found: error
