name: Native engine CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scheduler_trace:
        description: Capture one bounded Windows FULL workload scheduler diagnostic
        type: boolean
        default: false
      scheduler_pair_diagnostic:
        description: Diagnostic only - trace FULL and ACK statistics once, without qualification or packaging
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-native:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.scheduler_pair_diagnostic && 'Windows causal diagnostic - not qualification' || 'Windows x64 / MSVC 19.50+ / Release' }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      VULKAN_SDK_CHOCOLATEY_VERSION: 1.4.350
      SCHEDULER_TRACE: ${{ github.event_name == 'workflow_dispatch' && inputs.scheduler_trace }}

    steps:
      - name: Reject conflicting diagnostic selections
        if: github.event_name == 'workflow_dispatch' && inputs.scheduler_trace && inputs.scheduler_pair_diagnostic
        shell: pwsh
        run: throw 'Select either the legacy FULL diagnostic or the diagnostic-only pair'

      - name: Checkout recursive dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Verify recursive dependency checkout
        shell: pwsh
        run: |
          $Status = git submodule status --recursive
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect Git submodules. Ensure Git is installed and the checkout includes recursive submodules."
          }
          $Invalid = @($Status -split "`n" | Where-Object { $_ -match '^[\-+U]' })
          if ($Invalid.Count -ne 0) {
            throw "Submodules are missing, conflicted, or not at their pinned revisions:`n$($Invalid -join "`n")"
          }
          $Status
          $SourceCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Unable to record actual CI source commit' }
          $SourceCommit | Set-Content -Encoding ascii qualified-source-commit.txt

      - name: Install pinned repository tools
        uses: paradoxum-games/setup-rokit@c6a9749169e3a0146019b899cd0342556f773908 # v3
        with:
          version: 1.2.0
          cache: true

      - name: Locate class-generator formatter
        shell: pwsh
        run: |
          $ClangFormatCommand = Get-Command clang-format.exe -ErrorAction SilentlyContinue
          $ClangFormatPath = if ($ClangFormatCommand) { $ClangFormatCommand.Source } else { $null }
          if (-not $ClangFormatPath) {
            $VsWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            if (Test-Path -LiteralPath $VsWhere -PathType Leaf) {
              $Installation = & $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
              $VisualStudioLlvm = if ($Installation) { Join-Path $Installation 'VC\Tools\Llvm' } else { $null }
              if ($VisualStudioLlvm -and (Test-Path -LiteralPath $VisualStudioLlvm)) {
                $ClangFormatPath = Get-ChildItem -LiteralPath $VisualStudioLlvm -Filter clang-format.exe -File -Recurse |
                  Select-Object -First 1 -ExpandProperty FullName
              }
            }
          }
          if (-not $ClangFormatPath) {
            throw "clang-format is required by tools/classgen.luau but was not found on PATH or in Visual Studio's LLVM tools."
          }
          $ClangFormatDirectory = Split-Path -Parent $ClangFormatPath
          $ClangFormatDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $ClangFormatPath --version

      - name: Generate native class and reflection sources
        shell: pwsh
        run: |
          if (-not $env:HOME) {
            if (-not $env:USERPROFILE) {
              throw "Lute requires HOME, but neither HOME nor USERPROFILE is defined by the runner."
            }
            $env:HOME = $env:USERPROFILE
          }
          lute tools/classgen
          if ($LASTEXITCODE -ne 0) {
            throw "Class generation failed. Verify the pinned Lute installation and clang-format availability."
          }
          $RequiredGeneratedFiles = @(
            'include/gargantuan/classes/generated/Instance.hpp',
            'src/classes/generated/Instance.cpp',
            'include/gargantuan/services/generated/Workspace.hpp',
            'src/services/generated/Workspace.cpp'
          )
          $Missing = @($RequiredGeneratedFiles | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($Missing.Count -ne 0) {
            throw "Class generation completed without required outputs: $($Missing -join ', ')"
          }

      - name: Install shader compiler
        shell: pwsh
        run: |
          choco install vulkan-sdk --version=$env:VULKAN_SDK_CHOCOLATEY_VERSION --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 1641, 3010)) {
            throw "Vulkan SDK installation failed with exit code $LASTEXITCODE. Gargantuan requires glslc to compile its SPIR-V shaders."
          }
          $Glslc = Get-ChildItem -LiteralPath 'C:\VulkanSDK' -Filter glslc.exe -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -match '[\\/]Bin$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $Glslc) {
            throw "The Vulkan SDK installed, but glslc.exe was not found beneath C:\VulkanSDK."
          }
          & $Glslc.FullName --version
          if ($LASTEXITCODE -ne 0) {
            throw "The discovered glslc executable could not report its version: $($Glslc.FullName)"
          }
          "GLSLC_EXECUTABLE=$($Glslc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Locate supported MSVC toolchain
        shell: pwsh
        run: |
          $VsWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $VsWhere -PathType Leaf)) {
            throw "vswhere.exe is missing; the supported Visual Studio 2026 C++ toolchain cannot be located."
          }
          $Installation = & $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $Installation) {
            throw "Visual Studio with the x64 C++ build tools is required but was not found."
          }
          $DevCmd = Join-Path $Installation 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $DevCmd -PathType Leaf)) {
            throw "Visual Studio was found, but its developer environment script is missing: $DevCmd"
          }
          "VSDEVCMD=$DevCmd" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not defined; the pinned GameNetworkingSockets Protobuf manifest cannot be restored."
          }
          $VcpkgToolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts\buildsystems\vcpkg.cmake'
          if (-not (Test-Path -LiteralPath $VcpkgToolchain -PathType Leaf)) {
            throw "The vcpkg CMake toolchain is missing: $VcpkgToolchain"
          }
          "VCPKG_TOOLCHAIN=$VcpkgToolchain" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Release engine and tests
        shell: cmd
        run: |
          call "%VSDEVCMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          where cl || (echo ERROR: MSVC cl.exe is unavailable after VsDevCmd initialization. & exit /b 1)
          where cmake || (echo ERROR: CMake is required to configure Gargantuan but is not installed or on PATH. & exit /b 1)
          where ninja || (echo ERROR: Ninja is required by the supported CI configuration but is not installed or on PATH. & exit /b 1)
          cl /Bv
          cmake --version
          ninja --version
          cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DGARGANTUAN_TRACY=OFF -DGARGANTUAN_WITH_GNS=ON -DGARGANTUAN_BUILD_RENDERER_BENCHMARKS=ON -DGARGANTUAN_BUILD_SERIALIZATION_BENCHMARKS=ON -DGARGANTUAN_BUILD_GLAZE_SERIALIZATION_PROTOTYPE=OFF -DGARGANTUAN_GLSLC_EXECUTABLE="%GLSLC_EXECUTABLE%" -DCMAKE_TOOLCHAIN_FILE="%VCPKG_TOOLCHAIN%" -DVCPKG_MANIFEST_DIR="%CD%\cmake\gns" -DVCPKG_INSTALLED_DIR="%CD%\build-ci\vcpkg_installed" -DVCPKG_TARGET_TRIPLET=x64-windows -DFETCHCONTENT_BASE_DIR="%CD%\build-ci\_deps"

      - name: Build engine and registered test targets
        shell: cmd
        run: |
          call "%VSDEVCMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cmake --build build-ci --config Release --parallel %CMAKE_BUILD_PARALLEL_LEVEL%

      - name: Build bounded scheduler diagnostic
        shell: cmd
        run: |
          call "%VSDEVCMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++20 /O2 /W4 /WX /EHsc tools\ci\SchedulerTrace.cpp /Febuild-ci\scheduler-trace.exe /Fobuild-ci\scheduler-trace.obj advapi32.lib tdh.lib
          if errorlevel 1 exit /b %errorlevel%
          set "SCHEDULER_TRACE_TEST_HELPER=%CD%\build-ci\scheduler-trace.exe"
          python -m unittest discover -s tests -p "test_scheduler_trace.py" -v
          if errorlevel 1 exit /b %errorlevel%

      - name: Trace one FULL workload before independent native gates
        if: github.event_name == 'workflow_dispatch' && inputs.scheduler_trace
        shell: pwsh
        run: |
          & tools/ci/SchedulerTrace.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Trace fixed FULL and ACK statistics pair without qualification
        if: github.event_name == 'workflow_dispatch' && inputs.scheduler_pair_diagnostic
        shell: pwsh
        run: |
          & tools/ci/SchedulerTrace.ps1 -Pair
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete headless CTest contract
        if: "!(github.event_name == 'workflow_dispatch' && inputs.scheduler_pair_diagnostic)"
        shell: pwsh
        run: |
          # Complete CTest includes the funded ACK workload/mode/pool gates and
          # one paired native statistics-boundary run; do not duplicate them here.
          # CTest changes into --test-dir before opening its JUnit output.
          ctest --test-dir build-ci -C Release --parallel 2 --timeout 300 --output-on-failure --no-tests=error --output-junit "$env:GITHUB_WORKSPACE/build-ci/ctest-results.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Complete headless CTest contract failed' }
          if (-not (Test-Path -LiteralPath build-ci/ctest-results.xml -PathType Leaf) -or
              (Get-Item -LiteralPath build-ci/ctest-results.xml).Length -eq 0) {
            throw 'CTest did not produce the required upload-path JUnit evidence'
          }

      - name: Verify pinned Farm32 control and evidence tooling
        if: "!(github.event_name == 'workflow_dispatch' && inputs.scheduler_pair_diagnostic)"
        shell: pwsh
        run: |
          python tools/physical-qualifier/bootstrap.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Agent Coordinator bootstrap failed' }
          python -m unittest discover -s tools/physical-qualifier/tests -p 'test_f1_candidate_source.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F1 candidate source inventory tests failed' }
          python -m unittest discover -s tests -p 'test_foundation3l_four_client.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F1 raw four-client evidence replay tests failed' }
          python -m unittest discover -s tools/physical-qualifier/tests -p 'test_qualifier.py' -k phase1_raw_evidence -v
          if ($LASTEXITCODE -ne 0) { throw 'F1 raw evidence collection tests failed' }
          python -m unittest discover -s tools/physical-qualifier/tests -p 'test_qualifier.py' -k phase1_stage_is_distinct_and_fixed -v
          if ($LASTEXITCODE -ne 0) { throw 'F1 fixed capture staging test failed' }
          python -m unittest discover -s tools/physical-qualifier/tests -p 'test_farm_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Farm32 control and evidence tests failed' }
          python -m unittest discover -s tests -p 'test_foundation3l_acceptance.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Final Foundation 3L conjunction tests failed' }
          python -m unittest discover -s tests -p 'test_ci_junit_output.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'CI JUnit output-path regression tests failed' }
          # Control-only mocks; no capture, NIC, or installed-service operation.
          & tools/physical-qualifier/tests/TestCaptureHooks.ps1 -HookPath tools/physical-qualifier/worker/PktMonFarm32Capture.ps1 -Farm32
          & tools/physical-qualifier/tests/TestDumpcapFarm32Capture.ps1
          & tests/ContentScaleGameplayRecoveryTests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Client recovery callback regression failed' }
          & tests/ContentScaleGameplayRecoveryTests.ps1 -ReproduceMissingClientTick
          if ($LASTEXITCODE -ne 0) { throw 'Client recovery negative control failed' }

      - name: Run qualified reliable workload timing in Release
        if: "!(github.event_name == 'workflow_dispatch' && inputs.scheduler_pair_diagnostic)"
        shell: cmd
        run: |
          build-ci\gargantuan_game_session_real_transport_tests.exe --pooled --reliable-workload
          if errorlevel 1 exit /b %errorlevel%
          build-ci\gargantuan_game_session_real_transport_tests.exe --pooled --reliable-workload-32-structural
          if errorlevel 1 exit /b %errorlevel%
          rem Explicit diagnostics already ran FULL once before CTest; never repeat it.
          if not "%SCHEDULER_TRACE%"=="true" (
            build-ci\gargantuan_game_session_real_transport_tests.exe --reliable-workload
          )
          if errorlevel 1 exit /b %errorlevel%
          build-ci\gargantuan_game_session_real_transport_tests.exe --reliable-workload-32
          if errorlevel 1 exit /b %errorlevel%
          pwsh -NoProfile -File tools\ci\SchedulerTrace.ps1 -Case Aggregate32Structural
          if errorlevel 1 exit /b %errorlevel%

      - name: Package qualified 32-client physical candidate
        if: github.event_name == 'workflow_dispatch' && !inputs.scheduler_trace && !inputs.scheduler_pair_diagnostic
        shell: pwsh
        run: |
          $PackageRoot = Join-Path $PWD 'build-ci/QualifiedScalePhysical'
          $PlayerRuntime = Join-Path $PWD 'build-ci/RuntimeDistribution'
          $ServerRuntime = Join-Path $PWD 'build-ci/ServerRuntimeDistribution'
          & (Join-Path $PWD 'build-ci/gargantuan_qualified_scale_package.exe') `
            $PackageRoot $PlayerRuntime $ServerRuntime
          if ($LASTEXITCODE -ne 0) { throw 'Qualified scale package generation failed' }
          foreach ($Role in @('Player', 'Server')) {
            $RoleRoot = Join-Path $PackageRoot $Role
            $Files = @(Get-ChildItem -LiteralPath $RoleRoot -File -Recurse | Sort-Object FullName |
              ForEach-Object {
                [ordered]@{
                  Path = [IO.Path]::GetRelativePath($RoleRoot, $_.FullName).Replace('\', '/')
                  Bytes = $_.Length
                  Sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                }
              })
            if ($Files.Count -lt 3) { throw "Qualified $Role package is incomplete" }
            [IO.File]::WriteAllText((Join-Path $RoleRoot 'deployment-sha256.json'),
              ([ordered]@{ Format = 'GargantuanFarmDeployment'; Version = 1;
                SourceCommit = $env:GITHUB_SHA; Files = $Files } | ConvertTo-Json -Depth 5),
              [Text.UTF8Encoding]::new($false))
          }

      - name: Upload qualified 32-client physical candidate
        if: github.event_name == 'workflow_dispatch' && !inputs.scheduler_trace && !inputs.scheduler_pair_diagnostic
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: qualified-scale-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: build-ci/QualifiedScalePhysical/

      - name: Upload native CI diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-ci-diagnostics
          if-no-files-found: ignore
          path: |
            qualified-source-commit.txt
            build-ci/CMakeFiles/CMakeConfigureLog.yaml
            build-ci/Testing/Temporary/LastTest.log
            build-ci/ctest-results.xml
            build-ci/scheduler-trace/
            build-ci/scheduler-trace-ack-stats/
            build-ci/scheduler-trace-aggregate32-structural/
            build-ci/scheduler-trace-pair.json

  linux-sanitizers:
    name: Ubuntu 24.04 / Clang 19 / ASan + UBSan / Headless
    needs: windows-native
    if: "!(github.event_name == 'workflow_dispatch' && inputs.scheduler_pair_diagnostic)"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-19
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      SDL_VIDEODRIVER: dummy

    steps:
      - name: Checkout recursive dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Verify recursive dependency checkout
        shell: bash
        run: |
          set -euo pipefail
          git submodule status --recursive | tee /tmp/gargantuan-submodules.txt
          git rev-parse HEAD > qualified-source-commit.txt
          if grep -Eq '^[\-+U]' /tmp/gargantuan-submodules.txt; then
            echo "Submodules are missing, conflicted, or not at their pinned revisions."
            exit 1
          fi

      - name: Install Clang and headless build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang-19 \
            clang-format \
            cmake \
            glslc \
            libfreetype-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev \
            libclang-rt-19-dev \
            g++-14 \
            llvm-19 \
            ninja-build
          clang-19 --version
          g++-14 --version
          test -d /usr/lib/gcc/x86_64-linux-gnu/14
          clang++-19 --gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14 -v -E -x c++ /dev/null
          llvm-symbolizer-19 --version
          glslc --version

      - name: Install pinned repository tools
        uses: paradoxum-games/setup-rokit@c6a9749169e3a0146019b899cd0342556f773908 # v3
        with:
          version: 1.2.0
          cache: true

      - name: Generate native class and reflection sources
        shell: bash
        run: |
          set -euo pipefail
          lute tools/classgen
          test -f include/gargantuan/classes/generated/Instance.hpp
          test -f src/classes/generated/Instance.cpp
          test -f include/gargantuan/services/generated/Workspace.hpp
          test -f src/services/generated/Workspace.cpp

      - name: Configure Clang ASan and UBSan headless tests
        shell: bash
        run: |
          set -euo pipefail
          GccInstallDir=/usr/lib/gcc/x86_64-linux-gnu/14
          SanitizerFlags="--gcc-install-dir=$GccInstallDir -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          cmake -S . -B build-sanitizers -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_CXX_FLAGS="$SanitizerFlags" \
            -DCMAKE_EXE_LINKER_FLAGS="--gcc-install-dir=$GccInstallDir -fsanitize=address,undefined" \
            -DBUILD_TESTING=ON \
            -DGARGANTUAN_TRACY=OFF \
            -DGARGANTUAN_WITH_GNS=OFF \
            -DGARGANTUAN_BUILD_RENDERER_BENCHMARKS=OFF \
            -DGARGANTUAN_BUILD_SERIALIZATION_BENCHMARKS=ON \
            -DGARGANTUAN_BUILD_GLAZE_SERIALIZATION_PROTOTYPE=OFF \
            -DGARGANTUAN_GLSLC_EXECUTABLE="$(command -v glslc)"

      - name: Build sanitizer-instrumented engine and headless tests
        shell: bash
        run: cmake --build build-sanitizers --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"

      - name: Run complete sanitizer headless CTest contract
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build-sanitizers \
            --parallel 1 \
            --timeout 300 \
            --output-on-failure \
            --no-tests=error \
            --output-junit "$GITHUB_WORKSPACE/build-sanitizers/ctest-results.xml"
          test -s "$GITHUB_WORKSPACE/build-sanitizers/ctest-results.xml"

      - name: Upload sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sanitizer-ci-diagnostics
          if-no-files-found: ignore
          path: |
            qualified-source-commit.txt
            build-sanitizers/CMakeFiles/CMakeConfigureLog.yaml
            build-sanitizers/Testing/Temporary/LastTest.log
            build-sanitizers/ctest-results.xml
