name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish documentation from main (explicit deployment authorization)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Documentation integrity and site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source and pinned Luau compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build only the pinned Luau syntax compiler
        run: |
          git submodule update --init --depth 1 vendor/luau
          cmake -S vendor/luau -B .docs-luau -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_WEB=OFF
          cmake --build .docs-luau --target Luau.Compile.CLI --parallel 2
      - name: Validate documentation, declarations and examples
        run: |
          python -m unittest discover -s tools/docs -p 'test_*.py'
          python tools/docs/CheckDocumentation.py --luau-compile .docs-luau/luau-compile
          node --test tools/docs/test_repository_links.mjs
      - name: Install locked site dependencies
        working-directory: docs
        run: npm exec --yes --package=bun@1.3.13 -- bun install --frozen-lockfile
      - name: Build site
        working-directory: docs
        run: npm run build
      - name: Validate published routes and source links
        run: node tools/docs/CheckSite.mjs
      - name: Upload documentation
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
