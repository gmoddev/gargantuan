name: Maintained Jolt foundation qualification
on:
  push:
    branches: [experiment/jolt-optimized-foundation-20261108]
    paths:
      - 'experiments/PhysicsJoltEvaluation/Foundation/RunQualification.py'
      - 'experiments/PhysicsJoltEvaluation/Foundation/CMakeLists.txt'
      - 'experiments/PhysicsJoltEvaluation/ExperimentalVelocityReconstruction.hpp'
      - 'experiments/PhysicsJoltEvaluation/SoftFixtures.hpp'
      - 'experiments/PhysicsJoltEvaluation/ScheduledCouplingDiagnostic.cpp'
      - 'experiments/PhysicsJoltEvaluation/UnifiedCouplingEvaluation.cpp'
      - 'experiments/PhysicsJoltEvaluation/MakeEnergyObservation.py'
      - '.github/workflows/physics-jolt-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - name: Restore required experiment headers only
        run: git submodule update --init vendor/json vendor/box3d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: GantriaEngine/JoltPhysics
          ref: 109be79fa82be0b306c56e4b4357675ed7843767
          path: .foundation-jolt
          persist-credentials: false
      - name: Enable MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Installation = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$Installation\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          Get-ChildItem Env: | ForEach-Object { "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV }
      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-19 g++-14 ninja-build
      - name: Qualify maintained numerical foundation
        run: python experiments/PhysicsJoltEvaluation/Foundation/RunQualification.py
      - name: Retain raw successes and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maintained-jolt-foundation-${{ matrix.os }}
          path: foundation-evidence/
          if-no-files-found: error
